<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b111b"><title>오토바이 정비 · UI 뼈대</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#070b10;color:#dce6f1;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070b10}body{display:flex;justify-content:center}.app{width:100%;max-width:540px;min-height:100dvh;background:radial-gradient(ellipse at 50% 51%,#192531,#05080e 66%);box-shadow:0 0 30px #000}
.garage{position:relative;height:clamp(245px,52vw,325px);background:#111b25 url('./garage.svg') center center/cover no-repeat;overflow:hidden}.garage:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#080c12c7,transparent 28%,transparent 65%,#080b11a6);pointer-events:none}.title-slot{position:absolute;top:12px;left:14px;height:49px;width:55%;border-radius:9px;background:linear-gradient(135deg,#33455e92,#0b162878);border:1px solid #8ba2b154;box-shadow:inset 0 1px #ffffff30;z-index:1;display:flex;align-items:center;gap:8px;padding:7px}.title-icon{width:32px;height:32px;border:1px solid #8fa6b7b3;border-radius:7px;background:linear-gradient(#52677c,#152235);flex-shrink:0}.title-lines{flex:1;display:flex;flex-direction:column;gap:6px}.placeholder{background:linear-gradient(#aebbc9,#52677e);border-radius:2px;height:8px;opacity:.82}.placeholder.short{width:63%;height:6px;opacity:.47}.notification{position:absolute;right:14px;top:14px;width:44px;height:44px;background:linear-gradient(#455a70,#0c1726);border-radius:11px;border:1px solid #aabfce99;box-shadow:inset 0 2px #ffffff4a,0 3px 6px #0009;z-index:2}.bike-area{position:absolute;left:18%;top:23%;width:64%;height:65%;border:1px dashed #d3e3ef38;border-radius:42%;background:radial-gradient(ellipse,#e2e7ed10,transparent 72%);z-index:1}.ground-shadow{position:absolute;left:24%;width:52%;bottom:8%;height:19px;background:#0009;filter:blur(12px);border-radius:50%}

.bottom{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:22px 12px 0;padding:7px 7px max(9px,env(safe-area-inset-bottom));background:linear-gradient(#526176,#172433 28%,#050a10 90%);border:1px solid #9dadc2;border-radius:19px 19px 11px 11px;box-shadow:inset 0 2px #e0ebf791,0 -2px 13px #1a8fd547,0 4px 7px #000d}.nav{min-height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}.nav::before{content:"";height:22px;width:24px;border-radius:4px;border:2px solid #bac6d4;background:linear-gradient(#a5b4c4,#5b7189);opacity:.9}.nav::after{content:"";height:7px;width:48%;border-radius:4px;background:#8e9cae}.nav.active{border-radius:12px;border:1px solid #68c5fb;background:linear-gradient(#238def,#043781);box-shadow:inset 0 2px #caf4ff,0 0 7px #159dfbdd}.nav.active:before{border-color:#fff;background:#e9f9ff}.nav.active:after{background:#fff}
.note{text-align:center;color:#8e9caf;font-size:10px;padding:10px 4px 18px}.note strong{color:#dce6f1}
