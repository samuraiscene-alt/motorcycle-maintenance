<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b111b"><title>오토바이 정비 · UI 뼈대</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#070b10;color:#dce6f1;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070b10}body{display:flex;justify-content:center}.app{width:100%;max-width:540px;min-height:100dvh;background:radial-gradient(ellipse at 50% 51%,#192531,#05080e 66%);box-shadow:0 0 30px #000}
.garage{position:relative;height:clamp(245px,52vw,325px);background:#111b25 url('./garage.svg') center center/cover no-repeat;overflow:hidden}.garage:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#080c12c7,transparent 28%,transparent 65%,#080b11a6);pointer-events:none}.title-slot{position:absolute;top:12px;left:14px;height:49px;width:55%;border-radius:9px;background:linear-gradient(135deg,#33455e92,#0b162878);border:1px solid #8ba2b154;box-shadow:inset 0 1px #ffffff30;z-index:1;display:flex;align-items:center;gap:8px;padding:7px}.title-icon{width:32px;height:32px;border:1px solid #8fa6b7b3;border-radius:7px;background:linear-gradient(#52677c,#152235);flex-shrink:0}.title-lines{flex:1;display:flex;flex-direction:column;gap:6px}.placeholder{background:linear-gradient(#aebbc9,#52677e);border-radius:2px;height:8px;opacity:.82}.placeholder.short{width:63%;height:6px;opacity:.47}.notification{position:absolute;right:14px;top:14px;width:44px;height:44px;background:linear-gradient(#455a70,#0c1726);border-radius:11px;border:1px solid #aabfce99;box-shadow:inset 0 2px #ffffff4a,0 3px 6px #0009;z-index:2}.bike-area{position:absolute;left:18%;top:23%;width:64%;height:65%;border:1px dashed #d3e3ef38;border-radius:42%;background:radial-gradient(ellipse,#e2e7ed10,transparent 72%);z-index:1}.ground-shadow{position:absolute;left:24%;width:52%;bottom:8%;height:19px;background:#0009;filter:blur(12px);border-radius:50%}
.vehicle{margin:0 15px 13px;min-height:77px;display:grid;grid-template-columns:76px 1fr 118px;gap:10px;align-items:center;padding:8px 11px;background:linear-gradient(110deg,#f5f8fc,#7c8fa3 12%,#f6f8fb 24%,#adbfd1 49%,#f5f7fa 65%,#778a9d 90%,#e9eef3);border:2px solid #e1e7ee;border-radius:17px;box-shadow:inset 0 2px #fff,0 5px 6px #000a,0 0 0 1px #34485a;color:#1b2b3c}.brand-slot{height:56px;border-right:1px solid #344e64a8;display:grid;place-items:center;padding-right:10px}.brand-slot:before{content:"";display:block;width:51px;height:33px;border-radius:6px;background:linear-gradient(#cbd5df,#63758a);border:1px solid #8493a2}.vehicle-lines{display:flex;flex-direction:column;gap:9px;min-width:0}.vehicle-lines .placeholder{height:12px;width:84%;background:#30475d}.vehicle-lines .placeholder.short{height:8px;width:68%;background:#788b9a;opacity:.8}.vehicle-button{height:43px;border-radius:11px;border:2px solid #364b64;background:linear-gradient(#f7faff,#a6b9ce 52%,#e9f0fa);box-shadow:inset 0 2px #fff,0 3px 4px #2532459c}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 15px 18px}
.tab{height:55px;min-width:0;display:flex;justify-content:center;align-items:center;gap:7px;padding:0 6px;border:1px solid #8494a8;border-radius:13px;background:linear-gradient(180deg,#526277 0%,#253348 14%,#111c2b 58%,#050b13 100%);color:#e5edf6;box-shadow:inset 0 2px 1px #c8daed83,inset 0 -2px 2px #0007,0 4px 6px #000a,0 0 0 1px #17283c;text-shadow:0 2px 2px #000a}
.tab.active{border:2px solid #93d7ff;background:linear-gradient(180deg,#62b8fc 0%,#127ed5 32%,#0757b1 70%,#022b66 100%);color:#fff;box-shadow:inset 0 2px #d8f4ffbf,inset 0 -2px #003a83,0 0 12px #1ba1ffb8,0 4px 6px #0009}
.tab svg{width:22px;height:22px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px #0007)}
.tab>span{display:block;width:auto;height:auto;background:none!important;color:inherit;font-size:13px;font-weight:900;white-space:nowrap;letter-spacing:-.7px;opacity:1}
@media(max-width:390px){.tabs{gap:5px}.tab{height:48px;gap:4px;padding:0 3px}.tab svg{height:18px;width:18px}.tab>span{font-size:11px;letter-spacing:-.8px}}
.rows{padding:0 15px;display:flex;flex-direction:column;gap:10px}.part{min-height:86px;display:grid;grid-template-columns:82px minmax(0,1fr) 48px;align-items:center;gap:11px;background:linear-gradient(180deg,#c2ceda,#354655 6%,#1b2935 16%,#111922 65%,#475768 94%,#bbc6d0);border:1px solid #9dabbd;border-radius:15px;box-shadow:inset 0 2px 2px #eaf7ff88,0 3px 6px #000c;color:#fff;padding:6px 9px}.part-img{height:68px;border:1px solid #8193a7;border-radius:9px;background:linear-gradient(120deg,#6f8092,#14202d 28%,#324454 62%,#8d9eae);box-shadow:inset 0 1px #ffffff73}.part-body{min-width:0;display:flex;flex-direction:column;gap:12px}.part-line{display:flex;justify-content:space-between;gap:8px}.part-line i{display:block;background:#abb9c7;height:10px;width:39%;border-radius:4px;opacity:.85}.part-line i:last-child{width:33%;height:8px;opacity:.6}.gauge{height:13px;background:linear-gradient(#111821,#3b4859);border:1px solid #a4b6ca;border-radius:20px;box-shadow:inset 0 2px 3px #0009}.service{height:43px;width:43px;border-radius:11px;border:2px solid #8aa7c6;background:linear-gradient(#399ff4,#0b58ac 58%,#082f64);box-shadow:inset 0 2px #e2f6ffad,0 2px 4px #000c}
.bottom{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:22px 12px 0;padding:7px 7px max(9px,env(safe-area-inset-bottom));background:linear-gradient(#526176,#172433 28%,#050a10 90%);border:1px solid #9dadc2;border-radius:19px 19px 11px 11px;box-shadow:inset 0 2px #e0ebf791,0 -2px 13px #1a8fd547,0 4px 7px #000d}.nav{min-height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}.nav::before{content:"";height:22px;width:24px;border-radius:4px;border:2px solid #bac6d4;background:linear-gradient(#a5b4c4,#5b7189);opacity:.9}.nav::after{content:"";height:7px;width:48%;border-radius:4px;background:#8e9cae}.nav.active{border-radius:12px;border:1px solid #68c5fb;background:linear-gradient(#238def,#043781);box-shadow:inset 0 2px #caf4ff,0 0 7px #159dfbdd}.nav.active:before{border-color:#fff;background:#e9f9ff}.nav.active:after{background:#fff}
.note{text-align:center;color:#8e9caf;font-size:10px;padding:10px 4px 18px}.note strong{color:#dce6f1}
