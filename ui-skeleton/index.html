.vehicle{grid-template-columns:81px minmax(0,1fr)}

</main><nav class="bottom" aria-label="하단 메뉴 디자인 시안"><div class="nav active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg><span>홈</span></div><div class="nav"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15l2.5 2.5L16 12"/></svg><span>정비일정</span></div><div class="nav"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg><span>정비등록</span></div><div class="nav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 10h18c0-2-3-3-3-10M10 21h4"/></svg><span>알림</span></div><div class="nav"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M10 2h4l.6 2.5 2 1.2 2.3-1 2 3.4-1.8 1.8v2.3l1.8 1.8-2 3.4-2.3-1-2 1.2L14 20h-4l-.6-2.4-2-1.2-2.3 1-2-3.4 1.8-1.8V9.9L3.1 8l2-3.4 2.3 1 2-1.2z"/></svg><span>설정</span></div></nav><div class="note"><strong>오토바이 정비 · 카드 스와이프 시제품</strong> | 차량을 좌우로 넘기고 탭해 선택</div></div><script>
(()=>{'use strict';
const stage=document.getElementById('garage'),track=document.getElementById('showroom-track'),counter=document.getElementById('showroom-count'),check=document.getElementById('showroom-check'),tint=document.getElementById('showroom-tint'),name=document.querySelector('.bike-model'),meta=document.querySelector('.bike-meta'),brand=document.getElementById('brand-slot');
const bikes=[
 {name:'HONDA PCX125',meta:'중고차 · 시작 <b>12,300km</b>',brand:'honda'},
 {name:'스쿠터 B · 시연',meta:'조명 전환·스와이프 검증용',brand:'unknown'}
];
let index=0,chosen=-1,pointer=null,drag=0,moved=false,animating=false,resetCheckTimer=0;
function width(){return stage.getBoundingClientRect().width||1}
function position(px,animate){track.style.transition=animate?'transform 370ms cubic-bezier(.22,.75,.19,1)':'none';track.style.transform='translate3d('+(-index*width()+px)+'px,0,0)'}
const hondaLogo=brand.innerHTML,unbrandedLogo='<svg viewBox="0 0 64 42" aria-hidden="true" class="generic-bike-mark"><circle cx="15" cy="30" r="8"/><circle cx="49" cy="30" r="8"/><path d="M15 30 26 14h13l10 16M25 14l8 16H15m18 0 10-13h8"/></svg><strong>BRAND</strong>';
function renderInfo(){const current=bikes[index];name.textContent=current.name;meta.innerHTML=current.meta;brand.innerHTML=current.brand==='honda'?hondaLogo:unbrandedLogo;brand.setAttribute('aria-label',current.brand==='honda'?'혼다':'제조사 미정');counter.textContent=bikes.map((_,i)=>i===index?'●':'○').join(' ')}
function hideCheck(){clearTimeout(resetCheckTimer);check.classList.remove('visible');check.setAttribute('aria-hidden','true')}
function selectVisible(){if(animating)return;chosen=index;renderInfo();check.classList.remove('visible');void check.offsetWidth;check.classList.add('visible');check.setAttribute('aria-hidden','false');clearTimeout(resetCheckTimer);resetCheckTimer=setTimeout(hideCheck,1100)}
function change(next){if(next<0||next>=bikes.length||animating){position(0,true);return}animating=true;hideCheck();index=next;position(0,true);renderInfo();tint.classList.remove('flash');void tint.offsetWidth;tint.classList.add('flash');setTimeout(()=>{animating=false},385)}
stage.addEventListener('pointerdown',e=>{if(animating||(!e.isPrimary)||e.button!==0)return;pointer={id:e.pointerId,start:e.clientX,y:e.clientY,at:Date.now()};drag=0;moved=false;try{stage.setPointerCapture(e.pointerId)}catch{}});
stage.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id||animating)return;const dx=e.clientX-pointer.start,dy=e.clientY-pointer.y;if(Math.abs(dy)>Math.abs(dx)*1.5&&Math.abs(dy)>12)return;drag=dx;moved=moved||Math.abs(dx)>9;const blocked=(index===0&&dx>0)||(index===bikes.length-1&&dx<0);position(blocked?dx*.25:dx,false)});
function finish(e,cancel){if(!pointer||e.pointerId!==pointer.id)return;const delta=e.clientX-pointer.start,vertical=e.clientY-pointer.y,elapsed=Date.now()-pointer.at,wasMoved=moved;pointer=null;drag=0;if(cancel){position(0,true);return}if(Math.abs(delta)>=48||Math.abs(delta)>22&&elapsed<220){const next=index+(delta<0?1:-1);if(next>=0&&next<bikes.length){change(next);return}}position(0,true);if(!wasMoved&&Math.abs(delta)<9&&Math.abs(vertical)<12)selectVisible()}
stage.addEventListener('pointerup',e=>finish(e,false));stage.addEventListener('pointercancel',e=>finish(e,true));
stage.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();change(index+1)}else if(e.key==='ArrowLeft'){e.preventDefault();change(index-1)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();selectVisible()}});
stage.tabIndex=0;stage.setAttribute('role','button');stage.setAttribute('aria-label','오토바이 카드: 좌우 스와이프 또는 방향키로 이동, 탭 또는 Enter로 선택');
window.addEventListener('resize',()=>position(0,false));window.addEventListener('pageshow',()=>position(0,false));
renderInfo();position(0,false);
})();
</script></body></html>
